openapi: 3.0.3
info:
  title: x-admin API
  description: 通用 RBAC 管理后台 API。所有响应统一为 `{code,message,data,request_id}`。
  version: 1.0.0
servers:
  - url: /
    description: Same origin (Nginx / Vite proxy)
tags:
  - name: Auth
    description: 验证码、登录、刷新、当前用户
  - name: Dashboard
  - name: Online
  - name: Monitor
  - name: User
  - name: Role
  - name: Menu
  - name: Department
  - name: Dictionary
  - name: Parameter
  - name: File
  - name: Job
  - name: Audit
  - name: Profile
  - name: Notification
security:
  - bearerAuth: []
paths:
  /admin/v1/auth/captcha:
    get:
      tags: [Auth]
      summary: 获取 SVG 验证码
      security: []
      responses:
        '200':
          description: captcha_id 与 data URL 图片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /admin/v1/auth/login:
    post:
      tags: [Auth]
      summary: 登录（10 次/分/IP）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, captcha_id, captcha_code]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: Admin@123456 }
                captcha_id: { type: string }
                captcha_code: { type: string }
      responses:
        '200':
          description: |
            账号未开启双重验证时返回 access/refresh token；
            开启后返回 `{mfa_required:true, mfa_token, mfa_expires_in}`，需继续调用 `/auth/login/mfa`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '423':
          description: 连续失败 5 次，账号锁定 15 分钟
  /admin/v1/auth/login/mfa:
    post:
      tags: [Auth]
      summary: 完成 Google Authenticator 二次验证（20 次/分/IP）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, otp_code]
              properties:
                mfa_token: { type: string, description: 登录第一步返回的临时令牌 }
                otp_code: { type: string, description: 6 位动态验证码或一次性恢复码 }
      responses:
        '200':
          description: access/refresh token
        '401':
          description: 验证码错误或验证会话过期
        '429':
          description: 单个验证会话错误次数过多，需要重新登录
  /admin/v1/auth/passkey/login/begin:
    post:
      tags: [Auth]
      summary: 开始通行密钥（Passkey）登录（20 次/分/IP）
      security: []
      responses:
        '200':
          description: 返回 `session_id` 与 WebAuthn PublicKeyCredentialRequestOptions
  /admin/v1/auth/passkey/login/finish:
    post:
      tags: [Auth]
      summary: 完成通行密钥登录并签发 token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, credential]
              properties:
                session_id: { type: string }
                credential: { type: object, description: navigator.credentials.get 序列化结果 }
      responses:
        '200':
          description: access/refresh token
        '401':
          description: 通行密钥验证失败或验证会话过期
  /admin/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: 轮换 refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 新 token 对
  /admin/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 退出并删除 refresh 白名单
  /admin/v1/auth/me:
    get:
      tags: [Auth]
      summary: 当前用户、权限码与菜单树
      responses:
        '200':
          description: MeResult
  /admin/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: 看板汇总、7 日登录趋势、最近操作
      responses:
        '200':
          description: DashboardSummary
  /admin/v1/online-sessions:
    get:
      tags: [Online]
      summary: 管理员视角的在线会话分页列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - { name: user_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 在线会话列表；额外返回去重后的在线用户数 users
    delete:
      tags: [Online]
      summary: 强制下线指定设备或某个用户的全部会话
      description: 请求体带 session_id 时只撤销该设备；不带时撤销该用户全部会话。
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string }
  /admin/v1/monitor/overview:
    get:
      tags: [Monitor]
      summary: 系统监控快照（主机、Go 运行时、数据库连接池、缓存）
      responses:
        '200':
          description: MonitorOverview
  /admin/v1/users:
    get:
      tags: [User]
      summary: 用户分页列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - { name: dept_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: integer, enum: [0, 1] } }
        - { name: role_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 用户分页
    post:
      tags: [User]
      summary: 创建用户
    delete:
      tags: [User]
      summary: 批量删除用户
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
  /admin/v1/users/{id}:
    get:
      tags: [User]
      summary: 用户详情
      parameters:
        - $ref: '#/components/parameters/ID'
    put:
      tags: [User]
      summary: 更新用户
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/users/{id}/status:
    put:
      tags: [User]
      summary: 启用 / 停用用户
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/users/{id}/password:
    put:
      tags: [User]
      summary: 重置密码
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/users/{id}/roles:
    put:
      tags: [User]
      summary: 分配角色
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/users/import:
    post:
      tags: [User]
      summary: Excel 导入用户（最多 500 行）
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
  /admin/v1/users/export:
    get:
      tags: [User]
      summary: 导出用户 xlsx
  /admin/v1/users/template:
    get:
      tags: [User]
      summary: 下载导入模板
  /admin/v1/roles:
    get:
      tags: [Role]
      summary: 角色分页
    post:
      tags: [Role]
      summary: 创建角色
  /admin/v1/roles/all:
    get:
      tags: [Role]
      summary: 全部启用角色（下拉）
  /admin/v1/roles/{id}:
    put:
      tags: [Role]
      summary: 更新角色
      parameters:
        - $ref: '#/components/parameters/ID'
    delete:
      tags: [Role]
      summary: 删除角色
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/roles/{id}/menus:
    get:
      tags: [Role]
      summary: 角色已分配菜单 ID
      parameters:
        - $ref: '#/components/parameters/ID'
    put:
      tags: [Role]
      summary: 分配菜单权限
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/menus/tree:
    get:
      tags: [Menu]
      summary: 完整菜单树
  /admin/v1/menus:
    post:
      tags: [Menu]
      summary: 创建菜单 / 按钮
  /admin/v1/menus/{id}:
    put:
      tags: [Menu]
      summary: 更新菜单
      parameters:
        - $ref: '#/components/parameters/ID'
    delete:
      tags: [Menu]
      summary: 删除菜单
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/departments/tree:
    get:
      tags: [Department]
      summary: 部门树
  /admin/v1/departments:
    post:
      tags: [Department]
      summary: 创建部门
  /admin/v1/departments/{id}:
    put:
      tags: [Department]
      summary: 更新部门
      parameters:
        - $ref: '#/components/parameters/ID'
    delete:
      tags: [Department]
      summary: 删除部门
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/dict/types:
    get:
      tags: [Dictionary]
      summary: 字典类型分页
    post:
      tags: [Dictionary]
      summary: 创建字典类型
  /admin/v1/dict/types/{id}:
    put:
      tags: [Dictionary]
      summary: 更新字典类型
      parameters:
        - $ref: '#/components/parameters/ID'
    delete:
      tags: [Dictionary]
      summary: 删除字典类型
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/dict/types/{id}/items:
    get:
      tags: [Dictionary]
      summary: 字典项列表
      parameters:
        - $ref: '#/components/parameters/ID'
    post:
      tags: [Dictionary]
      summary: 创建字典项
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/dict/items/{id}:
    put:
      tags: [Dictionary]
      summary: 更新字典项
      parameters:
        - $ref: '#/components/parameters/ID'
    delete:
      tags: [Dictionary]
      summary: 删除字典项
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/parameters:
    get:
      tags: [Parameter]
      summary: 参数分页
    post:
      tags: [Parameter]
      summary: 创建参数
  /admin/v1/parameters/public:
    get:
      tags: [Parameter]
      summary: 公开参数列表（无需登录）
      security: []
  /admin/v1/parameters/{id}:
    put:
      tags: [Parameter]
      summary: 更新参数
      parameters:
        - $ref: '#/components/parameters/ID'
    delete:
      tags: [Parameter]
      summary: 删除参数
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/files:
    get:
      tags: [File]
      summary: 文件分页
      parameters:
        - name: kind
          in: query
          description: 文件类型，可逗号组合：image, video, audio, document, archive, other
          schema: { type: string, example: image,video }
    post:
      tags: [File]
      summary: 上传文件
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
  /admin/v1/files/{id}/shares:
    get:
      tags: [File]
      summary: 文件分享记录
      parameters:
        - $ref: '#/components/parameters/ID'
    post:
      tags: [File]
      summary: 创建可撤销分享链接
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/files/{id}/shares/{shareID}:
    delete:
      tags: [File]
      summary: 撤销分享链接
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: shareID
          in: path
          required: true
          schema: { type: integer, format: int64 }
  /admin/v1/files/{id}/download:
    get:
      tags: [File]
      summary: 下载文件
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/files/{id}:
    delete:
      tags: [File]
      summary: 删除文件
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/jobs:
    get:
      tags: [Job]
      summary: 定时任务分页
    post:
      tags: [Job]
      summary: 创建任务
  /admin/v1/jobs/{id}:
    put:
      tags: [Job]
      summary: 更新任务
      parameters:
        - $ref: '#/components/parameters/ID'
    delete:
      tags: [Job]
      summary: 删除任务
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/jobs/{id}/status:
    put:
      tags: [Job]
      summary: 启停任务
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/jobs/{id}/run:
    post:
      tags: [Job]
      summary: 立即执行任务
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/jobs/{id}/runs:
    get:
      tags: [Job]
      summary: 任务执行历史
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Page'
  /admin/v1/logs/operations:
    get:
      tags: [Audit]
      summary: 操作日志分页
    delete:
      tags: [Audit]
      summary: 删除指定操作日志
  /admin/v1/logs/operations/export:
    get:
      tags: [Audit]
      summary: 导出操作日志 Excel
  /admin/v1/logs/operations/clear:
    delete:
      tags: [Audit]
      summary: 清空操作日志
  /admin/v1/logs/logins:
    get:
      tags: [Audit]
      summary: 登录日志分页
  /admin/v1/logs/logins/export:
    get:
      tags: [Audit]
      summary: 导出登录日志 Excel
  /admin/v1/logs/logins/clear:
    delete:
      tags: [Audit]
      summary: 清空登录日志
  /admin/v1/profile:
    get:
      tags: [Profile]
      summary: 个人资料
    put:
      tags: [Profile]
      summary: 更新个人资料
  /admin/v1/profile/sessions:
    get:
      tags: [Profile]
      summary: 在线设备列表
  /admin/v1/profile/sessions/{id}:
    delete:
      tags: [Profile]
      summary: 退出指定设备
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
  /admin/v1/profile/session-actions/revoke-others:
    post:
      tags: [Profile]
      summary: 退出其他设备
  /admin/v1/profile/session-actions/revoke-all:
    post:
      tags: [Profile]
      summary: 退出全部设备
  /admin/v1/profile/password:
    put:
      tags: [Profile]
      summary: 修改密码
  /admin/v1/profile/totp:
    get:
      tags: [Profile]
      summary: Google Authenticator 绑定状态与剩余恢复码
    delete:
      tags: [Profile]
      summary: 关闭双重验证（需当前密码 + 动态验证码或恢复码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, otp_code]
              properties:
                password: { type: string }
                otp_code: { type: string, description: 6 位动态验证码或一次性恢复码 }
  /admin/v1/profile/totp/setup:
    post:
      tags: [Profile]
      summary: 生成 TOTP 密钥、otpauth 链接和二维码（未启用时可用）
      responses:
        '200':
          description: 返回 secret、otpauth_url、qr_code（PNG data URL）
  /admin/v1/profile/totp/enable:
    post:
      tags: [Profile]
      summary: 校验动态验证码并启用双重验证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, otp_code]
              properties:
                password: { type: string }
                otp_code: { type: string, description: 6 位动态验证码 }
                refresh_token: { type: string, description: 当前会话 refresh token，用于在开启双重验证后保持本机登录 }
      responses:
        '200':
          description: 返回 10 个一次性恢复码（仅此一次）
  /admin/v1/profile/passkeys:
    get:
      tags: [Profile]
      summary: 当前用户的通行密钥设备列表
  /admin/v1/profile/passkeys/begin:
    post:
      tags: [Profile]
      summary: 开始绑定通行密钥（需当前密码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: 返回 `session_id` 与 WebAuthn PublicKeyCredentialCreationOptions
  /admin/v1/profile/passkeys/finish:
    post:
      tags: [Profile]
      summary: 完成通行密钥绑定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, credential]
              properties:
                session_id: { type: string }
                name: { type: string, description: 设备名称 }
                credential: { type: object, description: navigator.credentials.create 序列化结果 }
  /admin/v1/profile/passkeys/{id}:
    put:
      tags: [Profile]
      summary: 重命名通行密钥设备
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
    delete:
      tags: [Profile]
      summary: 删除通行密钥设备
      parameters:
        - $ref: '#/components/parameters/ID'
  /admin/v1/notifications:
    get:
      tags: [Notification]
      summary: 当前用户通知分页（unread=1 只看未读）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: unread
          in: query
          schema: { type: integer, enum: [0, 1] }
  /admin/v1/notifications/unread-count:
    get:
      tags: [Notification]
      summary: 未读通知数量
  /admin/v1/notifications/read-all:
    put:
      tags: [Notification]
      summary: 全部标记为已读
  /admin/v1/notifications/{id}/read:
    put:
      tags: [Notification]
      summary: 标记单条通知为已读
      parameters:
        - $ref: '#/components/parameters/ID'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 20, maximum: 200 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { type: object }
        request_id: { type: string }
    Page:
      type: object
      properties:
        list:
          type: array
          items: { type: object }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
