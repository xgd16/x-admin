# x-admin 框架文档站配置
# 本地预览：pip install -r docs-requirements.txt && mkdocs serve
site_name: x-admin 文档
site_description: x-admin 框架设计、扩展指南与实现契约
site_url: https://xgd16.github.io/x-admin/
site_author: xgd16
copyright: Copyright &copy; 2026 xgd16 · MIT License

repo_url: https://github.com/xgd16/x-admin
repo_name: xgd16/x-admin
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 首页: index.md
  - 开发指南:
      - 本地开发与快速上手: guide/getting-started.md
      - 架构与请求生命周期: guide/architecture.md
      - 多 API 模式: guide/multi-api.md
      - 新增一个业务模块: guide/adding-a-module.md
  - 后端开发:
      - 认证、会话与二次验证: backend/auth.md
      - 权限体系（RBAC）: backend/rbac.md
      - 字典、参数、通知与看板: backend/system.md
      - 文件、存储与分享: backend/files.md
      - 定时任务: backend/jobs.md
      - 日志与审计: backend/audit.md
      - 在线会话与系统监控: backend/monitor.md
      - 异步导出框架: export.md
      - 基础库: backend/packages.md
      - 中间件与请求治理: backend/middleware.md
      - 数据库、模型与迁移: backend/database.md
      - 测试与质量: backend/testing.md
  - 前端开发:
      - 架构、路由与状态: frontend/architecture.md
      - 页面与功能地图: frontend/pages.md
      - API 客户端与数据请求: frontend/api-client.md
      - 通用组件与交互: frontend/components.md
      - 主题、样式与响应式: frontend/theme.md
  - 专题深入:
      - wire 依赖注入教程: wire-tutorial.md
      - 前台用户认证: front-auth.md
  - 部署运维:
      - 配置参考: ops/config.md
      - 部署与发布: ops/deploy.md
      - 排错手册: ops/troubleshooting.md
  - 工具链:
      - 交互式界面（TUI）: tool/tui.md
      - 框架升级工具: tool/upgrade.md
      - 代码生成（create）: tool/create.md
  - 参考:
      - 系统实现规格（SPEC）: spec.md
      - API 一览与错误码: reference/api.md
      - 权限码清单: reference/permissions.md
      - OpenAPI 定义: https://github.com/xgd16/x-admin/blob/main/internal/docs/openapi.yaml
  - 相关资源:
      - GitHub 仓库: https://github.com/xgd16/x-admin
      - 版本发布: https://github.com/xgd16/x-admin/releases
      - 问题反馈: https://github.com/xgd16/x-admin/issues

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xgd16/x-admin
      name: x-admin on GitHub
