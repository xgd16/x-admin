name: x-admin

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: xadmin
      MYSQL_USER: xadmin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xadmin}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uxadmin", "-pxadmin"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      X_ADMIN_APP_ENV: production
      X_ADMIN_SERVER_HOST: 0.0.0.0
      X_ADMIN_SERVER_PORT: "8080"
      X_ADMIN_DATABASE_DSN: xadmin:${MYSQL_PASSWORD:-xadmin}@tcp(mysql:3306)/xadmin?charset=utf8mb4&parseTime=True&loc=Local&multiStatements=true
      X_ADMIN_REDIS_ADDR: redis:6379
      X_ADMIN_JWT_SECRET: ${JWT_SECRET:-change-me-x-admin-production-secret-2026}
      X_ADMIN_STORAGE_ROOT: /app/data/uploads
      X_ADMIN_CORS_ORIGINS: http://localhost,http://127.0.0.1
      X_ADMIN_WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      X_ADMIN_WEBAUTHN_RP_DISPLAY_NAME: ${WEBAUTHN_RP_DISPLAY_NAME:-x-admin}
      X_ADMIN_WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:-http://localhost,http://localhost:5173}
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  uploads:
